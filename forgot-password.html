<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Investment | Forgot Password</title><style>
:root{
  --dark:#0f172a;
  --orange:#ff4d1a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:var(--dark);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  background:white;
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

p{
  text-align:center;
  margin-bottom:20px;
  color:#555;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--orange);
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  opacity:.9;
}

.back{
  text-align:center;
  margin-top:15px;
}

.back a{
  color:var(--orange);
  text-decoration:none;
}
</style></head>
<body><div class="container"><h2>Forgot Password</h2><p>
Enter your email address and we'll send you a password reset link.
</p><input
type="email"
id="email"
placeholder="Enter your email address">

<button onclick="resetPassword()">
Send Reset Link
</button><div class="back">
<a href="index.html">
Back to Login
</a>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
async function resetPassword(){

  const email =
  document.getElementById("email").value;

  if(!email){
    alert("Please enter your email address");
    return;
  }

  const { error } =
  await supabase.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:
      "https://bs-investment-company.vercel.app"
    }
  );

  if(error){
    alert(error.message);
    return;
  }

  alert(
    "Password reset email sent. Check your inbox."
  );
}
</script></body>
</html>
