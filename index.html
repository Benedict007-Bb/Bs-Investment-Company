<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Investment | Login</title><style>
:root{
  --dark:#0f172a;
  --orange:#ff4d1a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:var(--dark);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--orange);
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  opacity:.9;
}

.links{
  text-align:center;
  margin-top:15px;
}

.links a{
  color:var(--orange);
  text-decoration:none;
  display:block;
  margin-top:10px;
}
</style></head>
<body><div class="login-box"><h2>BS Investment Login</h2><input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="loginUser()">
Login
</button><div class="links">
<a href="register.html">
Create Account
</a><a href="forgot-password.html">
Forgot Password?
</a>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
async function loginUser(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  if(!email || !password){
    alert("Please fill all fields");
    return;
  }

  const { data, error } =
  await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Login successful");

  window.location.href =
  "dashboard.html";
}
</script></body>
</html>
