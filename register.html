<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Investment | Register</title><style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.container{
  background:white;
  color:black;
  width:400px;
  max-width:95%;
  padding:30px;
  border-radius:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  background:#ff4d1a;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

.link{
  text-align:center;
  margin-top:15px;
}

a{
  color:#ff4d1a;
  text-decoration:none;
}
</style></head>
<body><div class="container"><h2>Create Account</h2><input type="text" id="fullName" placeholder="Full Name">
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email Address">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="country" placeholder="Country">
<input type="password" id="password" placeholder="Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password"><button onclick="registerUser()">
Create Account
</button><div class="link">
Already have an account?
<a href="index.html">Login</a>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
async function registerUser(){

  const fullName =
  document.getElementById("fullName").value.trim();

  const username =
  document.getElementById("username").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const phone =
  document.getElementById("phone").value.trim();

  const country =
  document.getElementById("country").value.trim();

  const password =
  document.getElementById("password").value;

  const confirmPassword =
  document.getElementById("confirmPassword").value;

  if(
    !fullName ||
    !username ||
    !email ||
    !phone ||
    !country ||
    !password ||
    !confirmPassword
  ){
    alert("Please fill all fields");
    return;
  }

  if(password !== confirmPassword){
    alert("Passwords do not match");
    return;
  }

  const { data, error } =
  await supabase.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    alert(error.message);
    return;
  }

  if(!data.user){
    alert("Unable to create account");
    return;
  }

  const { error: profileError } =
  await supabase
  .from("investmentcompany")
  .insert([
    {
      user_id: data.user.id,
      full_name: fullName,
      username: username,
      email: email,
      phone: phone,
      country: country,
      balance: 0,
      profit: 0,
      active_investment: 0
    }
  ]);

  if(profileError){
    alert(profileError.message);
    return;
  }

  alert(
    "Account created successfully. Please check your email and verify your account before logging in."
  );

  window.location.href = "index.html";
}
</script></body>
</html>
